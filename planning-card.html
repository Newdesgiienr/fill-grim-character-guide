<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fill Grim · 카드의 타격감 연출</title>
<style>
:root{
  --bg:#edf2f7;
  --card:#fff;
  --navy:#172942;
  --text:#17304d;
  --muted:#738297;
  --line:#d7e0ea;
  --soft:#f7f9fc;
  --orange:#ff7a3d;
  --orange-soft:#fff5ee;
  --orange-line:#ff9a66;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
button{font:inherit}
.shell{width:min(1480px,calc(100% - 24px));margin:12px auto 32px}
.note{
  background:var(--card);
  border:1px solid #cfd8e3;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 14px 34px rgba(22,40,64,.06);
}
.note-head{
  min-height:84px;
  padding:19px 20px 19px 25px;
  background:var(--navy);
  color:#fff;
  display:grid;
  grid-template-columns:minmax(0,1fr) 44px;
  gap:18px;
  align-items:center;
  cursor:pointer;
}
.note-title{
  min-width:0;
  display:flex;
  align-items:center;
  gap:13px;
}
.orange{
  width:3px;
  height:31px;
  border-radius:99px;
  background:#ec7f37;
  flex:0 0 auto;
}
.note-copy{
  min-width:0;
  display:flex;
  align-items:baseline;
  gap:13px;
  flex-wrap:wrap;
}
.note-head h1{
  margin:0;
  color:#fff;
  font-size:20px;
  line-height:1.2;
  letter-spacing:-.035em;
}
.note-head p{
  margin:0;
  color:#d2dbe7;
  font-size:13px;
  line-height:1.55;
  font-weight:700;
}
.chev{
  width:42px;height:42px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:11px;
  background:rgba(255,255,255,.04);
  display:grid;
  place-items:center;
  cursor:pointer;
}
.chev-icon{
  width:11px;height:11px;
  border-right:1.7px solid #f0f4f8;
  border-bottom:1.7px solid #f0f4f8;
  transform:rotate(45deg) translate(-2px,-2px);
  transition:transform .18s ease;
}
.note.collapsed .chev-icon{transform:rotate(-135deg) translate(-1px,-1px)}
.note.collapsed .note-body{display:none}

.note-body{padding:18px}

.flow-wrap{
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  overflow-x:auto;
  padding:12px;
}
.flow{
  min-width:920px;
  display:grid;
  grid-template-columns:minmax(0,1fr) 34px minmax(0,1fr) 34px minmax(0,1fr) 34px minmax(0,1fr);
  align-items:stretch;
}
.flow-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  color:#93a2b5;
  font-size:25px;
  font-weight:700;
}
.stage{
  position:relative;
  min-height:78px;
  border:1px solid #d2dce7;
  border-radius:12px;
  background:#fbfcfe;
  padding:13px 15px 12px;
  text-align:left;
  cursor:pointer;
  color:var(--text);
  transition:border-color .14s ease,background .14s ease,box-shadow .14s ease;
}
.stage:hover{
  border-color:#b9c8d9;
  background:#fff;
}
.stage.active{
  border-color:var(--orange-line);
  background:var(--orange-soft);
  box-shadow:inset 0 -3px 0 var(--orange);
}
.stage-title{
  display:block;
  font-size:14px;
  line-height:1.3;
  font-weight:900;
  letter-spacing:-.02em;
}
.stage-range{
  display:block;
  margin-top:7px;
  color:#77879a;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;
  font-weight:700;
}
.stage.active .stage-range{color:#d66a31}

.workspace{
  margin-top:14px;
  display:grid;
  grid-template-columns:minmax(0,1fr);
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden;
  background:#fff;
}
.workspace-head{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}
.current-copy{min-width:0}
.current-kicker{
  color:var(--orange);
  font-size:11px;
  font-weight:900;
  margin-bottom:3px;
}
.current-title{
  margin:0;
  color:#17304d;
  font-size:18px;
  line-height:1.3;
  letter-spacing:-.025em;
}
.current-range{
  flex:0 0 auto;
  padding:7px 10px;
  border:1px solid #dbe4ee;
  border-radius:9px;
  background:#f8fafc;
  color:#52647a;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:11.5px;
  font-weight:800;
}

.video-shell{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#0e1723;
}
video{
  width:100%;
  height:100%;
  max-width:none;
  max-height:none;
  display:block;
  object-fit:contain;
  background:#0b111a;
}
.time-overlay{
  position:absolute;
  top:12px;
  right:12px;
  display:flex;
  gap:7px;
  align-items:center;
  padding:7px 9px;
  border-radius:9px;
  background:rgba(9,17,27,.76);
  color:#fff;
  backdrop-filter:blur(5px);
  pointer-events:none;
}
.time-overlay .label{
  color:#b9c6d5;
  font-size:10px;
  font-weight:800;
}
.time-overlay .value{
  min-width:58px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.precision-bar{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:12px;
  padding:11px 14px;
  background:#142235;
  border-top:1px solid rgba(255,255,255,.08);
  color:#fff;
}
.precision-time{
  min-width:126px;
  display:flex;
  align-items:baseline;
  gap:5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;
}
#currentTime{
  color:#fff;
  font-size:14px;
  font-weight:900;
}
#durationTime{
  color:#8fa0b4;
  font-size:11px;
  font-weight:700;
}
.scrub{
  width:100%;
  accent-color:var(--orange);
  cursor:pointer;
}
.nudge{
  display:flex;
  gap:6px;
}
.nudge button{
  border:1px solid #405066;
  background:#1e3047;
  color:#eaf0f6;
  border-radius:8px;
  padding:6px 8px;
  font-size:10.5px;
  font-weight:900;
  cursor:pointer;
}
.nudge button:hover{border-color:#60758e;background:#263b55}

.hint{
  padding:11px 14px 13px;
  border-top:1px solid var(--line);
  background:#fff;
  color:#6f7f91;
  font-size:11.5px;
  line-height:1.55;
}
.hint b{color:#394f69}

@media(max-width:760px){
  .shell{width:min(100% - 12px,1480px);margin-top:6px}
  .note-head{padding:16px;grid-template-columns:minmax(0,1fr) 42px}
  .note-title{align-items:flex-start}
  .note-copy{display:block}
  .note-head h1{font-size:18px}
  .note-head p{margin-top:5px;font-size:12px}
  .note-body{padding:10px}
  .workspace-head{align-items:flex-start;flex-direction:column}
  .current-range{align-self:flex-start}
  .precision-bar{grid-template-columns:1fr;gap:8px}
  .nudge{justify-content:flex-start}
  .time-overlay{top:8px;right:8px}
}
</style>

<style>
.stage-desc{
  display:block;
  margin-top:7px;
  color:#75869a;
  font-size:13.4px;
  font-weight:700;
  line-height:1.6;
  word-break:keep-all;
}
.stage.active .stage-desc{color:#56697f}
.stage-range{display:none!important}
.note-copy{flex-wrap:nowrap!important}
.note-head p{max-width:none!important}
@media(max-width:960px){
  .note-copy{flex-wrap:wrap!important}
}
</style>


<style>
.stage-desc{
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
}
</style>


<style>
.precision-bar,
.time-overlay{
  display:none !important;
}
</style>


<style>
.current-range{
  display:none !important;
}
.clip-play-btn{
  flex:0 0 auto;
  min-height:36px;
  padding:0 14px;
  border:0;
  border-radius:8px;
  background:#ff7a3d;
  color:#fff;
  font-size:11.5px;
  font-weight:900;
  cursor:pointer;
  box-shadow:none;
  white-space:nowrap;
}
.clip-play-btn:hover{
  background:#ed6d31;
}
</style>

<style id="planning-child-style">
html,body{
  margin:0!important;padding:0!important;height:auto!important;min-height:0!important;
  background:transparent!important;overflow-x:hidden!important;overflow-y:visible!important;
  overflow-anchor:none!important;
}
.shell{width:100%!important;margin:0!important;padding:0!important;height:auto!important;min-height:0!important}
.page-top,.topline{display:none!important}
.note{
  margin:0!important;padding:0!important;border:0!important;border-radius:0!important;
  box-shadow:none!important;background:transparent!important;overflow:visible!important;
  height:auto!important;min-height:0!important;
}
.note-head{display:none!important}
.note-body-wrap,.note.collapsed .note-body-wrap{
  display:block!important;opacity:1!important;overflow:visible!important;height:auto!important;min-height:0!important;
}
.note-body-clip{min-height:0!important;height:auto!important;overflow:visible!important}
.note-body,.note.collapsed .note-body{
  display:block!important;visibility:visible!important;opacity:1!important;height:auto!important;
  min-height:0!important;max-height:none!important;overflow:visible!important;padding:0!important;background:transparent!important;
}
</style>
</head>
<body>
<div class="shell">
  <section class="note" id="note">
    <div class="note-head" id="noteToggle" role="button" tabindex="0" aria-expanded="true">
      <div class="note-title">
        <span class="orange"></span>
        <div class="note-copy">
          <h1>카드의 타격감 연출</h1>
          <p>같은 월의 카드를 맞춰 획득 흐름을 만들고, 족보 완성으로 코스트를 획득하는 주요 판정마다 즉각적인 시각·속도 피드백을 배치해 반복 파밍에서도 타격감과 리듬이 유지되도록 설계했습니다.</p>
        </div>
      </div>
      <button class="chev" id="toggleButton" type="button" aria-label="접기 또는 펼치기">
        <span class="chev-icon"></span>
      </button>
    </div>

    <div class="note-body">
      <div class="flow-wrap">
        <div class="flow" id="flow">
          <button class="stage active" type="button" data-index="0">
            <span class="stage-title">카드 배분</span>
            <span class="stage-desc">페이즈 시작 · 순차 배분으로 시작 리듬을 만듭니다.</span>
          </button>
          <span class="flow-arrow">→</span>
          <button class="stage" type="button" data-index="1">
            <span class="stage-title">카드 매칭</span>
            <span class="stage-desc">같은 월 판정 · 빠른 반응으로 매칭 타격감을 줍니다.</span>
          </button>
          <span class="flow-arrow">→</span>
          <button class="stage" type="button" data-index="2">
            <span class="stage-title">연속 획득</span>
            <span class="stage-desc">폭탄 특수 효과 · 연속 획득으로 보상감을 높입니다.</span>
          </button>
          <span class="flow-arrow">→</span>
          <button class="stage" type="button" data-index="3">
            <span class="stage-title">획득 보류</span>
            <span class="stage-desc">뻑 특수 효과 · 획득 보류로 흐름에 긴장감을 줍니다.</span>
          </button>
        </div>
      </div>

      <div class="workspace">
        <div class="workspace-head">
          <div class="current-copy">
            <div class="current-kicker">카드의 타격감 연출</div>
            <h2 class="current-title" id="currentTitle">카드 배분</h2>
          </div>
          <button class="clip-play-btn" id="clipPlayBtn" type="button">▶ 재생</button>
        </div>

        <div class="video-shell">
          <video id="video" controls playsinline preload="metadata">
            
          </video>
        </div>

<div id="videoError" style="display:none;padding:12px 14px;background:#fff3f0;color:#9a3412;border-top:1px solid #fed7aa;font-size:12px;font-weight:800">
영상 로드에 실패했습니다.
</div>
        </div>
      </div>
  </section>
</div>

<script>
const stages = [
  {title:"카드 배분", start:0.000, end:1.796, sourceKey:"deal"},
  {title:"카드 매칭", start:10.442, end:13.533, sourceKey:"matching"},
  {title:"연속 획득", start:6.184, end:10.192, sourceKey:"chain"},
  {title:"획득 보류", start:2.074, end:5.862, sourceKey:"hold"}
];

const CARD_ASSET_URL = "Assets/VIDEOS/SCENARIO/01_card_matching.mp4";

const $ = s => document.querySelector(s);
const video = $("#video");
const currentTitle = $("#currentTitle");
const clipPlayBtn = $("#clipPlayBtn");
const videoError = $("#videoError");

let activeStage = 0;

function activeSegment(){
  return stages[activeStage] || stages[0];
}

function setSegmentPosition(autoplay=false){
  const seg=activeSegment();
  if(!video||!seg)return;

  const apply=()=>{
    try{video.currentTime=seg.start;}catch(e){}
    if(autoplay){
      const p=video.play();
      if(p&&p.catch)p.catch(()=>{});
    }
  };

  if(video.dataset.directAsset!==CARD_ASSET_URL){
    try{video.pause();}catch(e){}
    video.dataset.directAsset=CARD_ASSET_URL;
    video.src=CARD_ASSET_URL;
    video.preload="metadata";
    video.load();
    if(video.readyState>=1)apply();
    else video.addEventListener("loadedmetadata",apply,{once:true});
  }else{
    apply();
  }
}

function renderStage(index,autoplay=false){
  activeStage=Math.max(0,Math.min(index,stages.length-1));
  document.querySelectorAll(".stage").forEach((el,i)=>el.classList.toggle("active",i===activeStage));
  currentTitle.textContent=stages[activeStage].title;
  clipPlayBtn.textContent="▶ 재생";
  if(videoError)videoError.style.display="none";
  setSegmentPosition(autoplay);
}

document.querySelectorAll(".stage").forEach((el,i)=>{
  el.addEventListener("pointerdown",()=>{
    try{parent.postMessage({type:"fill-grim-frame-scroll-lock",key:"card",phase:"start"},"*");}catch(e){}
  });
  el.addEventListener("click",()=>{
    try{parent.postMessage({type:"fill-grim-frame-scroll-lock",key:"card",phase:"start"},"*");}catch(e){}
    renderStage(i,false);
    setTimeout(()=>{
      try{parent.postMessage({type:"fill-grim-frame-scroll-lock",key:"card",phase:"settle"},"*");}catch(e){}
    },450);
  });
});

clipPlayBtn.addEventListener("click",async ()=>{
  const seg=activeSegment();
  if(!seg)return;
  if(video.paused||video.ended){
    if(video.ended||video.currentTime<seg.start-0.05||video.currentTime>=seg.end-0.03){
      try{video.currentTime=seg.start;}catch(e){}
    }
    try{await video.play();}catch(e){}
  }else{
    video.pause();
  }
});

video.addEventListener("loadedmetadata",()=>{
  try{parent.postMessage({type:"fill-grim-frame-scroll-lock",key:"card",phase:"settle"},"*");}catch(e){}
});
video.addEventListener("error",()=>{
  if(videoError)videoError.style.display="block";
});
video.addEventListener("timeupdate",()=>{
  const seg=activeSegment();
  if(seg&&video.currentTime>=seg.end){
    video.pause();
    try{video.currentTime=seg.end;}catch(e){}
    clipPlayBtn.textContent="↻ 다시 재생";
  }
});
video.addEventListener("play",()=>{clipPlayBtn.textContent="■ 정지";});
video.addEventListener("pause",()=>{
  const seg=activeSegment();
  if(!seg||video.currentTime<seg.end-0.03)clipPlayBtn.textContent="▶ 재생";
});
video.addEventListener("ended",()=>{clipPlayBtn.textContent="↻ 다시 재생";});

renderStage(0,false);

const note = $("#note");
const toggle = $("#noteToggle");
const toggleButton = $("#toggleButton");
function setOpen(open){
  note.classList.toggle("collapsed",!open);
  toggle.setAttribute("aria-expanded",String(open));
}
function flip(){
  setOpen(toggle.getAttribute("aria-expanded") !== "true");
}
toggle.addEventListener("click",flip);
toggle.addEventListener("keydown",e=>{
  if(e.key==="Enter" || e.key===" "){
    e.preventDefault();
    flip();
  }
});
toggleButton.addEventListener("click",e=>e.stopPropagation());
toggleButton.addEventListener("click",flip);

setOpen(true);
</script>

<script id="planning-height-reporter">
(function(){
  const KEY="card";
  let lastHeight=0, raf=0;
  function contentHeight(){
    const target=document.querySelector(".note-body")||document.querySelector(".note")||document.querySelector(".shell")||document.body;
    if(!target)return 0;
    const r=target.getBoundingClientRect();
    return Math.ceil(Math.max(target.scrollHeight||0,target.offsetHeight||0,r.height||0));
  }
  function report(force=false){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const h=contentHeight();
      if(!h)return;
      if(!force&&Math.abs(h-lastHeight)<1)return;
      lastHeight=h;
      parent.postMessage({type:"fill-grim-planning-height",key:KEY,height:h},"*");
    });
  }
  window.addEventListener("load",()=>{report(true);setTimeout(()=>report(true),80);setTimeout(()=>report(true),300);setTimeout(()=>report(true),900)});
  window.addEventListener("message",e=>{if(e.data&&e.data.type==="fill-grim-planning-measure")report(true)});
  document.addEventListener("click",()=>{report();setTimeout(()=>report(true),120);setTimeout(()=>report(true),400)});
  if(window.ResizeObserver){
    const target=document.querySelector(".note-body")||document.querySelector(".note")||document.querySelector(".shell");
    if(target)new ResizeObserver(()=>report()).observe(target);
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>report(true));
})();
</script>

</body>
</html>
