<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILL GRIM</title>
<style>
html,body{margin:0;background:#f2f5f9;font-family:Inter,Pretendard,"Noto Sans KR",system-ui,sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;color:#63728a;font-weight:800}
.boot-error{width:min(760px,calc(100% - 32px));padding:22px;border:1px solid #d6dde8;border-radius:18px;background:#fff;color:#12284f;line-height:1.7}
</style>
</head>
<body>
<div class="boot" id="boot">FILL GRIM 가이드를 불러오는 중...</div>
<script>
(async function(){
  const BASE_INDEX_URLS=[
    "https://cdn.jsdelivr.net/gh/Newdesgiienr/fill-grim-character-guide@ea0d7aa553cd3304dd880f9dd32ed301d26f3cae/index.html",
    "https://raw.githubusercontent.com/Newdesgiienr/fill-grim-character-guide/ea0d7aa553cd3304dd880f9dd32ed301d26f3cae/index.html"
  ];

  function replaceRequired(source,from,to,label){
    if(!source.includes(from)) throw new Error(label+" 수정 위치를 찾지 못했습니다.");
    return source.replace(from,to);
  }

  async function fetchTextWithTimeout(url,timeout=12000){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeout);
    try{
      const response=await fetch(url,{cache:"no-store",signal:controller.signal});
      if(!response.ok)throw new Error("HTTP "+response.status);
      return await response.text();
    }finally{
      clearTimeout(timer);
    }
  }

  async function fetchFirst(urls){
    let lastError=null;
    for(const url of urls){
      try{
        return await fetchTextWithTimeout(url);
      }catch(err){
        lastError=err;
      }
    }
    throw lastError||new Error("메인 가이드 소스를 불러오지 못했습니다.");
  }

  try{
    let source=await fetchFirst(BASE_INDEX_URLS);

    /* 중첩 로더가 raw.githubusercontent.com을 다시 기다리며 멈추는 문제 방지 */
    source=source.replace(
      'const SNAPSHOT_URL="https://raw.githubusercontent.com/Newdesgiienr/fill-grim-character-guide/be4fc85758df63aa37a53973ff18fadbc3e1d6be/index.html";',
      'const SNAPSHOT_URL="https://cdn.jsdelivr.net/gh/Newdesgiienr/fill-grim-character-guide@be4fc85758df63aa37a53973ff18fadbc3e1d6be/index.html";'
    );
    source=source.replace(
      'const response=await fetch(SNAPSHOT_URL,{cache:"no-store"});',
      'const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(SNAPSHOT_URL,{cache:"no-store",signal:controller.signal});}finally{clearTimeout(timer);}'
    );

    const SCENARIO_VIDEO_SOURCES=[
      "https://newdesgiienr.github.io/fill-grim-character-guide/Assets/VIDEOS/SCENARIO/01_card_matching.mp4",
      "https://newdesgiienr.github.io/fill-grim-character-guide/Assets/VIDEOS/SCENARIO/02_yaku_complete.mp4",
      "https://newdesgiienr.github.io/fill-grim-character-guide/Assets/VIDEOS/SCENARIO/03_special_situation.mp4",
      "https://newdesgiienr.github.io/fill-grim-character-guide/Assets/VIDEOS/SCENARIO/04_game_end_condition.mp4"
    ];
    let scenarioVideoIndex=0;
    source=source.replace(/\\"source\\":\\"data:video\/mp4;base64,[A-Za-z0-9+/=]+\\"/g,(match)=>{
      if(scenarioVideoIndex>=SCENARIO_VIDEO_SOURCES.length)return match;
      return '\\"source\\":\\"'+SCENARIO_VIDEO_SOURCES[scenarioVideoIndex++]+'\\"';
    });
    if(scenarioVideoIndex!==SCENARIO_VIDEO_SOURCES.length){
      throw new Error("플레이 시나리오 영상 소스 교체 위치를 찾지 못했습니다.");
    }


    source=replaceRequired(
      source,
      'aria-expanded=\\"true\\" aria-controls=\\"planningNotesContent\\" aria-label=\\"기획 노트 접기\\"',
      'aria-expanded=\\"false\\" aria-controls=\\"planningNotesContent\\" aria-label=\\"기획 과정 펼치기\\"',
      "기획 노트 토글"
    );
    source=replaceRequired(
      source,
      '<div class=\\"planning-big-collapse is-open\\" id=\\"planningNotesContent\\">',
      '<div class=\\"planning-big-collapse\\" id=\\"planningNotesContent\\">',
      "기획 노트 기본 상태"
    );

    const planningMarker='<div class=\\"planning-notes-inner\\">\\n\\n        <section class=\\"planning-note-entry\\">';
    const planningInsert=
      '<div class=\\"planning-notes-inner\\">\\n\\n'+
      '        <div class=\\"planning-intent-host\\">\\n'+
      '          <iframe class=\\"planning-intent-frame\\" id=\\"planningIntentFrame\\" src=\\"planning-intent.html\\" title=\\"기획 의도\\" loading=\\"eager\\" scrolling=\\"no\\"></iframe>\\n'+
      '        </div>\\n\\n'+
      '        <section class=\\"planning-note-entry\\">';
    source=replaceRequired(source,planningMarker,planningInsert,"기획 의도 삽입");

    const oldMount='if(host&&template){host.appendChild(template.content.cloneNode(true));}';
    const newMount="if(host&&template){\n  const node=template.content.firstElementChild.cloneNode(true);\n  const gg=document.getElementById(\"gameGuideHeader\");\n  if(gg)host.insertBefore(node,gg);else host.appendChild(node);\n\n  const pif=node.querySelector(\"#planningIntentFrame\");\n  if(pif)pif.addEventListener(\"load\",()=>{\n    try{\n      const d=pif.contentDocument;\n      if(d&&d.head&&!d.getElementById(\"fillgrim-intent-bar-match\")){\n        const s=d.createElement(\"style\");\n        s.id=\"fillgrim-intent-bar-match\";\n        s.textContent=\n          \".intent-titlebar{position:relative!important;min-height:92px!important;margin-top:0!important;padding:0 23px 0 28px!important;border-radius:18px 18px 4px 4px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;background:linear-gradient(135deg,#29324a,#34405d)!important;color:#fff!important;box-shadow:0 12px 24px rgba(15,23,42,.13)!important;overflow:visible!important}\"+\n          \".intent-heading{display:flex!important;align-items:center!important;min-width:0!important;z-index:2!important}\"+\n          \".intent-accent{width:3px!important;height:32px!important;margin-right:14px!important;border-radius:999px!important;background:#f28c54!important;flex:0 0 auto!important}\"+\n          \".intent-title-copy{min-width:0!important;display:flex!important;align-items:center!important}\"+\n          \".intent-title{font-size:21px!important;line-height:1.2!important;font-weight:950!important;letter-spacing:-.03em!important;white-space:nowrap!important}\"+\n          \".intent-subtitle{margin-left:10px!important;color:#d9e0eb!important;font-size:13px!important;font-weight:800!important;line-height:1.45!important;text-align:left!important;white-space:nowrap!important}\"+\n          \".intent-toggle{width:44px!important;height:44px!important;flex:0 0 auto!important;display:grid!important;place-items:center!important;z-index:3!important;border:1px solid rgba(255,255,255,.22)!important;border-radius:13px!important;background:rgba(255,255,255,.08)!important;color:#fff!important}\"+\n          \".fusion-intent-summary{font-size:18px!important;line-height:1.55!important}\"+\n          \".fusion-intent-summary-highlight{display:block!important;margin-bottom:7px!important;color:#ec7f37!important;font-size:18px!important;font-weight:950!important;line-height:1.55!important}\"+\n          \".stage-head{align-items:flex-start!important}\"+\n          \".stage-copy{min-width:0!important}\"+\n          \".stage-num{display:inline-flex!important;align-items:center!important;justify-content:center!important;min-width:auto!important;width:auto!important;height:30px!important;margin:0!important;padding:0 10px!important;border-radius:8px!important;background:var(--orange-strong)!important;color:#fff!important;font-size:17px!important;font-weight:950!important;line-height:30px!important;letter-spacing:-.025em!important;white-space:nowrap!important;flex:0 0 auto!important;text-align:center!important}\";\n        d.head.appendChild(s);\n      }\n\n      const planTitle=d.querySelector(\".fillgrim-plan-title\");\n      const summary=d.querySelector(\".fusion-intent-summary\");\n      if(planTitle&&summary&&!summary.querySelector(\".fusion-intent-summary-highlight\")){\n        const highlight=d.createElement(\"span\");\n        highlight.className=\"fusion-intent-summary-highlight\";\n        highlight.textContent=planTitle.textContent.trim();\n        summary.insertBefore(highlight,summary.firstChild);\n        planTitle.remove();\n      }\n\n      const fusionBlock=d.querySelector(\".fusion-intent-block\");\n      if(summary&&fusionBlock&&fusionBlock.parentNode){\n        fusionBlock.parentNode.insertBefore(summary,fusionBlock);\n      }\n\n      Array.from(d.querySelectorAll(\".stage .stage-num\")).forEach((badge,index)=>{\n        badge.textContent=`레퍼런스 [${index+1}]`;\n        badge.setAttribute(\"aria-label\",badge.textContent);\n      });\n\n      const target=d.querySelector(\".preview-shell\")||d.body||d.documentElement;\n      const fit=()=>{\n        if(!target)return;\n        const h=Math.max(84,Math.ceil(target.getBoundingClientRect().height));\n        pif.style.height=h+\"px\";\n      };\n      fit();\n      if(window.ResizeObserver)new ResizeObserver(fit).observe(target);\n      pif.contentWindow.addEventListener(\"resize\",fit);\n    }catch(e){}\n  });\n\n  const skf=node.querySelector(\"#planningSkillFrame\");\n  if(skf)skf.addEventListener(\"load\",()=>{\n    try{\n      const sd=skf.contentDocument;\n      if(sd&&sd.head&&!sd.getElementById(\"fillgrim-skill-copy-size\")){\n        const ss=sd.createElement(\"style\");\n        ss.id=\"fillgrim-skill-copy-size\";\n        ss.textContent=\".strategy-desc,.step .clip-note,.mechanic-summary,.control-note{font-size:13.4px!important;line-height:1.6!important}\";\n        sd.head.appendChild(ss);\n      }\n    }catch(e){}\n  });\n\n  const cdf=node.querySelector(\"#planningCardFrame\");\n  if(cdf)cdf.addEventListener(\"load\",()=>{\n    try{\n      const cd=cdf.contentDocument;\n      const cw=cdf.contentWindow;\n      if(cd&&cd.head&&!cd.getElementById(\"fillgrim-card-quality-copy\")){\n        const cs=cd.createElement(\"style\");\n        cs.id=\"fillgrim-card-quality-copy\";\n        cs.textContent=\n          \".flow{min-width:1240px!important}\"+\n          \".stage-desc{font-size:13.4px!important;line-height:1.6!important;font-weight:740!important}\"+\n          \".video-shell{background:#0b111a!important}\"+\n          \".video-shell video{width:100%!important;max-width:none!important;height:auto!important;max-height:720px!important;object-fit:contain!important;image-rendering:auto!important}\";\n        cd.head.appendChild(cs);\n      }\n\n      /* 카드 타격감 영상도 embedded base64가 아니라 Assets의 원본 MP4를 직접 사용 */\n      const CARD_ASSET_URL=\"https://newdesgiienr.github.io/fill-grim-character-guide/Assets/VIDEOS/SCENARIO/01_card_matching.mp4\";\n      const segments=[\n        {title:\"카드 배분\",start:0.000,end:1.796},\n        {title:\"카드 매칭\",start:10.442,end:13.533},\n        {title:\"연속 획득\",start:6.184,end:10.192},\n        {title:\"획득 보류\",start:2.074,end:5.862}\n      ];\n      const video=cd.querySelector(\"#video\");\n      const buttons=Array.from(cd.querySelectorAll(\".stage\"));\n      const title=cd.querySelector(\"#currentTitle\");\n      const playBtn=cd.querySelector(\"#clipPlayBtn\");\n      const errorBox=cd.querySelector(\"#videoError\");\n      let activeIndex=0;\n      let pendingPlay=false;\n\n      const seekCurrent=(autoplay=false)=>{\n        const seg=segments[activeIndex];\n        if(!video||!seg)return;\n        const apply=()=>{\n          try{video.currentTime=seg.start;}catch(e){}\n          if(autoplay){\n            const p=video.play();\n            if(p&&p.catch)p.catch(()=>{});\n          }\n        };\n        if(video.dataset.directAsset!==CARD_ASSET_URL){\n          video.pause();\n          video.dataset.directAsset=CARD_ASSET_URL;\n          video.removeAttribute(\"src\");\n          video.src=CARD_ASSET_URL;\n          video.preload=\"metadata\";\n          video.load();\n          if(video.readyState>=1)apply();\n          else video.addEventListener(\"loadedmetadata\",apply,{once:true});\n        }else{\n          apply();\n        }\n      };\n\n      const selectStage=(index,autoplay=false)=>{\n        activeIndex=index;\n        buttons.forEach((el,i)=>el.classList.toggle(\"active\",i===index));\n        if(title)title.textContent=segments[index].title;\n        if(playBtn)playBtn.textContent=\"▶ 재생\";\n        if(errorBox)errorBox.style.display=\"none\";\n        seekCurrent(autoplay);\n      };\n\n      buttons.forEach((el,index)=>{\n        el.addEventListener(\"click\",e=>{\n          e.preventDefault();\n          e.stopImmediatePropagation();\n          try{parent.postMessage({type:\"fill-grim-frame-scroll-lock\",key:\"card\",phase:\"start\"},\"*\");}catch(_){}\n          selectStage(index,false);\n          setTimeout(()=>{try{parent.postMessage({type:\"fill-grim-frame-scroll-lock\",key:\"card\",phase:\"settle\"},\"*\");}catch(_){ }},450);\n        },true);\n      });\n\n      if(playBtn)playBtn.addEventListener(\"click\",e=>{\n        e.preventDefault();\n        e.stopImmediatePropagation();\n        const seg=segments[activeIndex];\n        if(video.paused||video.ended){\n          if(video.ended||video.currentTime<seg.start-.05||video.currentTime>=seg.end-.03){\n            try{video.currentTime=seg.start;}catch(_){}\n          }\n          const p=video.play();\n          if(p&&p.catch)p.catch(()=>{});\n        }else{\n          video.pause();\n        }\n      },true);\n\n      if(video){\n        video.addEventListener(\"timeupdate\",()=>{\n          const seg=segments[activeIndex];\n          if(!seg)return;\n          if(video.currentTime>=seg.end){\n            video.pause();\n            try{video.currentTime=seg.end;}catch(_){}\n            if(playBtn)playBtn.textContent=\"↻ 다시 재생\";\n          }\n        });\n        video.addEventListener(\"play\",()=>{if(playBtn)playBtn.textContent=\"■ 정지\";});\n        video.addEventListener(\"pause\",()=>{\n          const seg=segments[activeIndex];\n          if(playBtn&&(!seg||video.currentTime<seg.end-.03))playBtn.textContent=\"▶ 재생\";\n        });\n        video.addEventListener(\"error\",()=>{if(errorBox)errorBox.style.display=\"block\";});\n      }\n\n      selectStage(0,false);\n    }catch(e){}\n  });\n\n  window.addEventListener(\"message\",e=>{\n    const m=e.data;\n    if(!m||m.type!==\"fillgrim-intent-height\")return;\n    const f=document.getElementById(\"planningIntentFrame\");\n    if(f)f.style.height=Math.max(84,Math.ceil(Number(m.height)||84))+\"px\";\n  });\n}";
    source=replaceRequired(source,oldMount,newMount,"기획 노트 배치");

    source=replaceRequired(
      source,
      '<h1>기획 노트</h1>',
      '<h1>기획 과정</h1>',
      "기획 과정 제목"
    );

    const navOld='\'$1\\n    <button class="guide-nav-button" type="button" onclick="window.__openPlanningNotes&&window.__openPlanningNotes()">기획 노트로 이동</button>\'';
    const navNew='\'<button class="guide-nav-button" type="button" onclick="window.__openPlanningNotes&&window.__openPlanningNotes()">기획 과정</button>\\n    $1\'';
    source=replaceRequired(source,navOld,navNew,"기획 과정 버튼 순서");

    source=source.replace('`기획 노트 ${open?"접기":"펼치기"}`','`기획 과정 ${open?"접기":"펼치기"}`');

    const responseHook='let html=await response.text();';
    const responsePatch=`let html=await response.text();
    html=html.replace(
      '<div class="meta">화투 기반 카드 매칭 전략 게임</div>',
      '<div class="hero-meta-row"><div class="hero-tools-badge"><span class="hero-tool-item"><img class="hero-tool-icon" src="Assets/TOOLS/codex.png" alt=""><span>ChatGPT Codex</span></span><span class="hero-tool-item"><img class="hero-tool-icon" src="Assets/TOOLS/unity.png" alt=""><span>Unity</span></span><span class="hero-tool-note">연동 개발</span></div><div class="meta">화투 기반 카드 매칭 전략 게임</div></div>'
    );`;
    source=replaceRequired(source,responseHook,responsePatch,"히어로 도구 표시");

    const cssHook='html=html.replace(/<\\/head>/i,planningCss+"\\n</head>");';
    const extraCss=`<style id="planning-integration-extra">
#planningNotesSection{margin:0 0 18px!important;padding:0!important;}
#planningNotesHeader{margin-bottom:0!important;}
#planningNotesContent.is-open .planning-notes-inner{padding-top:18px!important;}
.planning-intent-host{width:100%;margin:0 0 18px!important;padding:0;box-sizing:border-box;}
.planning-intent-frame{display:block;width:100%;max-width:100%;height:92px;min-height:92px;border:0;background:transparent;overflow:hidden;box-sizing:border-box;}

/* 빠른 이동 순서: 기획 과정 → 게임 가이드 → 캐릭터 가이드 */
.guide-navigator .guide-nav-button[onclick*="__openPlanningNotes"]{order:1;}
.guide-navigator .guide-nav-button[data-guide-target="gameGuideHeader"]{order:2;}
.guide-navigator .guide-nav-button[data-guide-target="characterGuideHeader"]{order:3;}

.hero-meta-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px;}
.hero-meta-row .meta{margin-top:0!important;}
.hero-tools-badge{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:39px;padding:5px 12px 5px 7px;border-radius:999px;background:rgba(255,255,255,.07);color:#dbe4f2;font-size:14px;font-weight:850;line-height:1;}
.hero-tool-item{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;}
.hero-tool-icon{display:block;width:27px;height:27px;border-radius:8px;object-fit:cover;}
.hero-tool-note{padding-left:2px;color:#fff;font-weight:900;white-space:nowrap;}
@media(max-width:820px){
  .hero-meta-row{gap:8px}
  .hero-tools-badge{gap:8px;font-size:12px;flex-wrap:wrap}
  .hero-tool-icon{width:24px;height:24px;border-radius:7px}
}
</style>`;
    const cssPatch=cssHook+'\n    html=html.replace(/<\\/head>/i,'+JSON.stringify(extraCss+'\n</head>')+');';
    source=replaceRequired(source,cssHook,cssPatch,"통합 CSS");

    document.open();
    document.write(source);
    document.close();
  }catch(err){
    document.getElementById("boot").innerHTML=
      '<div class="boot-error"><b>통합 사이트를 불러오지 못했습니다.</b><br>'+
      String(err&&err.message?err.message:err)+
      '<br><small>네트워크 로딩이 12초를 넘으면 자동으로 중단되도록 수정했습니다.</small></div>';
  }
})();
</script>
</body>
</html>
