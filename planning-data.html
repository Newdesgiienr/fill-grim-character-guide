<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FILL GRIM · 개발 노트 데이터 테이블</title>
<style>
:root{
  --bg:#f4f6f9;--paper:#fff;--navy:#172942;--ink:#172235;--muted:#6f7d8e;
  --line:#d9e0e9;--line2:#e9edf2;--orange:#ec7f37;--orange-soft:#fff2e9;
  --blue:#376b9e;--blue-soft:#eef5fc;--shadow:0 14px 34px rgba(22,40,64,.08);
}
*{box-sizing:border-box} html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;letter-spacing:-.018em}
button{font:inherit;cursor:pointer}
.shell{width:min(1440px,calc(100% - 34px));margin:auto;padding:34px 0 84px}
.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:17px}
.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:900;color:#8c97a5;margin-bottom:7px}
.topline h1{margin:0;font-size:21px}.demo{border:1px solid #d4dce5;background:#fff;color:#718094;border-radius:999px;font-size:10px;font-weight:850;padding:8px 11px}
.note{background:#fff;border:1px solid #cfd8e3;border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.note-head{
  display:grid;grid-template-columns:minmax(0,1fr) 44px;align-items:center;gap:18px;
  min-height:84px;padding:19px 20px 19px 25px;background:var(--navy);color:#fff
}
.note-title{
  display:flex;align-items:center;gap:13px;min-width:0
}
.orange{
  width:3px;height:31px;border-radius:99px;background:var(--orange);flex:none
}
.note-head h2{
  margin:0;flex:none;font-size:20px;line-height:1.2;letter-spacing:-.035em
}
.note-head p{
  margin:0;min-width:0;color:#d2dbe7;font-size:13px;font-weight:700;line-height:1.55
}
.chev{
  width:42px;height:42px;border-radius:11px;border:1px solid rgba(255,255,255,.25);
  display:grid;place-items:center;color:#eef3f8;font-size:18px;background:rgba(255,255,255,.04)
}
.note-body{padding:24px;background:linear-gradient(180deg,#fafbfd 0,#fff 260px)}
.system-tabs{display:flex;gap:7px;margin-bottom:12px;overflow:auto}.system-tab{flex:none;border:1px solid #d7dfe8;background:#fff;color:#607085;border-radius:10px;padding:10px 14px;font-size:12.5px;font-weight:850}
.system-tab.active{background:var(--navy);border-color:var(--navy);color:#fff}

.flow-card{
  border:1px solid var(--line);background:#fff;border-radius:16px;
  padding:17px 18px 18px;margin-bottom:14px;
  box-shadow:0 3px 12px rgba(22,40,64,.035)
}
.flow-intro{
  display:flex;justify-content:space-between;gap:22px;align-items:flex-end;
  padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid #edf1f5
}
.flow-intro strong{
  display:block;font-size:15px;line-height:1.3;color:#22344a
}
.flow-intro strong::after{
  content:none;
  display:block;margin-top:5px;font-size:11px;font-weight:700;color:#8996a5
}
.flow-intro span{
  max-width:590px;font-size:12px;color:#66768a;line-height:1.6;text-align:right
}
.flow{
  display:flex;align-items:center;gap:0;overflow:auto;padding:1px 1px 2px
}
.flow-step{
  min-width:168px;flex:1 0 168px;min-height:82px;
  border:1px solid #d9e2ec;background:#fbfcfe;border-radius:12px;
  padding:12px 13px;text-align:left;position:relative;
  transition:border-color .16s ease,background .16s ease,transform .16s ease,box-shadow .16s ease
}
.flow-step:hover{
  background:#fff;border-color:#b9c8d8;transform:translateY(-1px);
  box-shadow:0 5px 13px rgba(32,52,75,.06)
}
.flow-step.active{
  background:#fff6ef;border-color:#eca369;
  box-shadow:inset 4px 0 0 var(--orange),0 5px 14px rgba(236,127,55,.08);
  padding-left:16px
}
.flow-step.active::after{content:none;display:none}
.flow-step .n{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:7px;background:#eef2f6;
  font-size:9px;font-weight:900;color:#748397
}
.flow-step.active .n{background:var(--orange);color:#fff}
.flow-step .t{
  display:block;margin-top:8px;font-size:14px;font-weight:900;color:#293b52;line-height:1.3
}
.flow-step .f{
  display:block;margin-top:5px;font:10.5px/1.35 Consolas,monospace;
  color:#8b98a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.flow-arrow{
  flex:0 0 30px;height:30px;display:grid;place-items:center;
  color:#91a0b0;font-size:17px;font-weight:800
}

.csv-hero{
  display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);
  border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden;
  margin-bottom:13px;box-shadow:0 3px 12px rgba(22,40,64,.035)
}
.hero-main{
  position:relative;padding:21px 22px 20px 25px;border-right:1px solid var(--line2)
}
.hero-main::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--orange)
}
.hero-kicker{display:flex;gap:9px;align-items:center;margin-bottom:9px}
.hero-step{
  display:inline-flex;align-items:center;border-radius:999px;
  padding:4px 7px;background:#fff0e4;color:#c45e1d;
  font-size:9px;font-weight:900;letter-spacing:.02em
}
.hero-file{
  font:10px/1.2 Consolas,monospace;color:#8593a4
}
.csv-hero h3{
  margin:0;font-size:28px;line-height:1.2;letter-spacing:-.04em;color:#14243a
}
.csv-hero .role{
  margin:10px 0 0;font-size:16px;font-weight:850;line-height:1.55;color:#26384e
}
.csv-hero .summary{
  margin:9px 0 0;max-width:820px;font-size:13.5px;line-height:1.7;color:#66768a
}
.hero-side{
  padding:20px 21px;background:#fafbfd;display:flex;flex-direction:column;justify-content:center
}
.hero-side .label{
  font-size:11.5px;font-weight:900;letter-spacing:.04em;color:#5f7084;margin-bottom:11px
}
.read-order{
  display:flex;align-items:center;flex-wrap:wrap;gap:6px;
  font-family:Consolas,monospace;color:#33485f
}
.read-chip{
  display:inline-flex;align-items:center;min-height:29px;
  padding:6px 8px;border:1px solid #d5dee8;background:#fff;border-radius:8px;
  font-size:11.5px;font-weight:850;white-space:nowrap
}
.read-arrow{color:#9aa7b5;font-size:12px}
.tip{
  margin-top:12px;padding-top:11px;border-top:1px solid #e5eaf0;
  font-size:11.5px;line-height:1.6;color:#65758a
}
.tip b{color:#cf6724}

.table-card{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden}
.table-toolbar{min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 11px 8px 14px;border-bottom:1px solid var(--line2)}
.table-title strong{display:block;font-size:14px}.table-title span{display:block;margin-top:4px;font-size:11px;color:#7f8c9b}
.toolbar-right{display:flex;gap:7px;align-items:center}.segment{display:flex;padding:2px;background:#f1f4f7;border-radius:9px;border:1px solid #e0e5eb}.view-btn{border:0;background:transparent;color:#748296;border-radius:6px;padding:7px 10px;font-size:11px;font-weight:850}.view-btn.active{background:#fff;color:#293a50;box-shadow:0 1px 3px rgba(25,39,58,.08)}
.help{font-size:11px;color:#7e8b9a}.help i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5f8db9;margin-right:4px}
.sheet-scroll{overflow:auto;max-height:530px}
table.sheet{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px;line-height:1.5}.sheet th,.sheet td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:left;background:#fff;vertical-align:middle}
.sheet th{position:sticky;top:0;z-index:4;padding:9px 10px;background:#edf1f5;color:#35465b;font-weight:850}.sheet th .kr{display:block;font-size:11.5px}.sheet th .raw{display:block;margin-top:3px;font:9.5px/1.25 Consolas,monospace;color:#8d99a6;font-weight:550}
.sheet td{padding:10px 11px;white-space:nowrap;max-width:460px;overflow:hidden;text-overflow:ellipsis}.sheet tr:nth-child(even) td{background:#fcfdfe}.sheet tr:hover td,.sheet tr.explain-hover td{background:#fff8f2!important}
.sheet .rowno{position:sticky;left:0;z-index:3;min-width:42px;width:42px;text-align:right;background:#f3f5f8;color:#9aa3ad;font-size:9px;border-right:1px solid #d9e0e8}.sheet thead .rowno{z-index:6;background:#e4e9ef}
.sheet td.wrap{white-space:normal;min-width:240px;line-height:1.58}.sheet td.joinable{padding:6px 8px}
.key{display:inline-flex;align-items:center;gap:5px;max-width:100%;border:1px solid #cbd9e6;background:#f7fbff;color:#315f8c;border-radius:7px;padding:5px 7px;font:11.5px/1.3 Consolas,monospace;font-weight:850}
.key::before{content:"";width:5px;height:5px;border-radius:50%;background:#5f8db9}.key.selected{background:#fff0e2;border-color:#e6a266;color:#743d11}.key.selected::before{background:var(--orange)}
.raw-view .sheet th .kr{display:none}.raw-view .sheet th .raw{margin:0;font-size:9.5px;color:#526176;font-weight:800}.raw-view .sheet{font-family:Consolas,monospace;font-size:11.5px}.raw-view .sheet td{padding:7px 8px}.raw-view .sheet td.wrap{white-space:nowrap;min-width:0}

/* 원본 행 해석: 스킬 단위 그룹 */
.row-explain{
  display:none;border-top:1px solid var(--line);background:#f8fafc;padding:19px 18px 20px
}
.row-explain.show{display:block}
.explain-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:20px;
  margin-bottom:14px
}
.explain-head strong{font-size:15px;color:#24354b}
.explain-head p{margin:5px 0 0;font-size:12px;line-height:1.6;color:#758397}
.explain-badge{
  flex:none;font-size:10px;font-weight:900;color:#856142;background:#fff4eb;
  border:1px solid #efd1b5;border-radius:999px;padding:7px 9px
}
.explain-list{display:grid;gap:11px}
.skill-group{
  border:1px solid #dce3eb;background:#fff;border-radius:12px;overflow:hidden
}
.skill-group-head{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 13px;background:#f3f6f9;border-bottom:1px solid #e2e8ee
}
.skill-group-title{min-width:0}
.skill-group-title strong{
  display:inline;font-size:13.5px;color:#283a50
}
.skill-group-title code{
  margin-left:7px;font:10.5px/1.2 Consolas,monospace;color:#7c8998
}
.skill-group-count{
  flex:none;font-size:10px;font-weight:850;color:#68788b;background:#fff;
  border:1px solid #d8e0e8;border-radius:999px;padding:5px 7px
}
.skill-group-body{padding:6px}
.explain-row{
  width:100%;display:grid;grid-template-columns:34px minmax(190px,250px) minmax(0,1fr);
  gap:12px;align-items:center;border:0;border-bottom:1px solid #edf1f4;background:#fff;
  border-radius:8px;padding:10px 9px;text-align:left;transition:.15s ease
}
.explain-row:last-child{border-bottom:0}
.explain-row:hover{
  background:#fff8f2;box-shadow:inset 3px 0 0 var(--orange);transform:none
}
.explain-num{font:10px/1 Consolas,monospace;color:#9aa5b1}
.explain-id{
  font:10.5px/1.35 Consolas,monospace;font-weight:850;color:#47627e;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.explain-text{font-size:13px;line-height:1.62;color:#34465c}
.explain-text b{color:#b86125}
.drawer{
  display:none;border-top:1px solid #efc9a7;background:#fffaf6;
  padding:0
}
.drawer.show{display:block;animation:drawerIn .22s ease both}
@keyframes drawerIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.drawer-head{
  display:flex;justify-content:space-between;align-items:flex-start;gap:18px;
  padding:17px 18px 13px;border-bottom:1px solid #f2dfcf
}
.drawer-title{display:flex;gap:11px;align-items:flex-start;min-width:0}
.drawer-title code{
  flex:none;font:12px/1 Consolas,monospace;font-weight:900;color:#6f3b14;
  background:#fff;border:1px solid #efb985;border-radius:8px;padding:7px 8px
}
.drawer-title strong{display:block;font-size:15px;color:#25374d}
.drawer-title span{display:block;margin-top:5px;font-size:11px;color:#8b705b}
.close{
  width:32px;height:32px;border:0;border-radius:8px;background:transparent;
  color:#a27e62;font-size:21px;line-height:1
}
.close:hover{background:#f7eadf}
.route{
  margin:14px 18px 12px;padding:12px 13px;border:1px solid #ead8c8;background:#fff;
  border-radius:11px;display:flex;align-items:center;gap:9px;overflow:auto
}
.route-node{
  flex:0 0 auto;min-width:150px;border:1px solid #d6e0e9;background:#f8fafc;
  border-radius:9px;padding:9px 10px
}
.route-node.current{border-color:#e79f62;background:#fff1e4}
.route-node b{display:block;font-size:12px;color:#31445a}
.route-node span{display:block;margin-top:4px;font:10px/1.35 Consolas,monospace;color:#778698}
.route-arrow{flex:none;color:#8f9eae;font-size:17px;font-weight:850}
.links{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:9px;padding:0 18px 17px
}
.link-card{
  border:1px solid #d9e2eb;background:#fff;border-radius:11px;padding:12px 13px;text-align:left;
  transition:.15s ease
}
.link-card:hover{
  border-color:#a9bfd4;box-shadow:0 5px 13px rgba(28,49,73,.06);transform:translateY(-1px)
}
.link-card .role{font-size:10.5px;color:#748397;font-weight:750;line-height:1.45}
.link-card .name{display:block;margin-top:5px;font-size:14px;font-weight:900;color:#283b52}
.link-card .file{display:block;margin-top:4px;font:10px/1.3 Consolas,monospace;color:#8c98a5}
.link-card .count{display:block;margin-top:9px;font-size:11px;font-weight:800;color:#416f9c}
.empty-link{padding:0 18px 17px;font-size:12px;color:#826c59}
.footer-note{margin-top:10px;font-size:9.5px;color:#98a2ae;line-height:1.55}.footer-note b{color:#758394}
@media(max-width:900px){
 .shell{width:min(100% - 18px,1440px);padding-top:16px}.note-head{grid-template-columns:minmax(0,1fr) 42px;gap:10px;padding:17px}.note-title{align-items:flex-start;flex-wrap:wrap}.note-head p{width:100%;padding-left:16px;font-size:12px}.orange{height:28px}.note-body{padding:13px}.flow-intro{display:block}.flow-intro span{display:block;margin-top:7px;text-align:left}.csv-hero{grid-template-columns:1fr}.hero-main{border-right:0;border-bottom:1px solid var(--line2)}.links{grid-template-columns:1fr}.table-toolbar{align-items:flex-start;flex-direction:column}.toolbar-right{width:100%;justify-content:space-between}.explain-row{grid-template-columns:30px minmax(120px,180px) minmax(260px,1fr);min-width:720px}.explain-list{overflow:auto}
}
</style>

<style>
/* 개발 노트 아코디언 — 기존 사이트의 접기/펴기 헤더 방식 */
.note-head{
  cursor:pointer;
  user-select:none;
  transition:background .18s ease;
}
.note-head:hover{background:#1b304d}
.note-head:focus-visible{
  outline:3px solid rgba(236,127,55,.28);
  outline-offset:-3px;
}
.chev{
  position:relative;
  padding:0;
  cursor:pointer;
  appearance:none;
  -webkit-appearance:none;
  transition:background .16s ease,border-color .16s ease,transform .16s ease;
}
.chev:hover{
  background:rgba(255,255,255,.09);
  border-color:rgba(255,255,255,.38);
}
.chev:focus-visible{
  outline:2px solid rgba(255,255,255,.75);
  outline-offset:2px;
}
.chev-icon{
  width:11px;
  height:11px;
  border-right:1.7px solid #f0f4f8;
  border-bottom:1.7px solid #f0f4f8;
  transform:rotate(225deg) translate(-1px,-1px);
  transition:transform .26s cubic-bezier(.2,.7,.2,1);
}
.note.collapsed .chev-icon{
  transform:rotate(45deg) translate(-2px,-2px);
}
.note-body-wrap{
  display:grid;
  grid-template-rows:1fr;
  opacity:1;
  transition:grid-template-rows .34s cubic-bezier(.2,.7,.2,1),opacity .22s ease;
}
.note-body-clip{
  min-height:0;
  overflow:hidden;
}
.note.collapsed .note-body-wrap{
  grid-template-rows:0fr;
  opacity:0;
}
.note.collapsed .note-head{
  min-height:82px;
}
@media(max-width:900px){
  .note-title{display:grid!important;grid-template-columns:4px auto;column-gap:12px;row-gap:7px}
  .note-title .orange{grid-row:1 / span 2}
  .note-title h2{grid-column:2}
  .note-title p{grid-column:2;padding-left:0!important;width:auto!important}
}
</style>


<style>
/* =========================================================
   DATA TABLE v10 · CLEAN / READABLE PASS
   ========================================================= */

body{font-size:15px}
.shell{width:min(1560px,calc(100% - 28px));padding-top:28px}
.topline h1{font-size:24px}
.eyebrow{font-size:11px}
.demo{font-size:11px}

.note-head{min-height:88px;padding:20px 22px 20px 27px}
.note-head h2{font-size:22px}
.note-head p{font-size:14px}
.note-body{padding:22px}

/* 시스템 탭 */
.system-tabs{gap:8px;margin-bottom:14px}
.system-tab{padding:11px 16px;font-size:14px;border-radius:10px}

/* 데이터 흐름 */

.flow-intro{display:block;padding:0 2px 11px;margin-bottom:11px}
.flow-intro strong{font-size:16px}
.flow-intro strong::after{content:none!important}
.flow-intro span{display:none!important}
.flow-step{min-width:176px;min-height:82px;padding:12px 13px}
.flow-step .n{width:24px;height:24px;font-size:10px}
.flow-step .t{margin-top:8px;font-size:15px}
.flow-step .f{margin-top:5px;font-size:11px}
.flow-arrow{flex-basis:32px;font-size:18px}

/* CSV 설명: 꼭 필요한 제목/역할 + 읽는 순서 */
.csv-hero{
 grid-template-columns:minmax(270px,.62fr) minmax(720px,1.38fr);
 align-items:stretch;
}
.hero-main{
 padding:22px 24px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}
.csv-hero h3{font-size:29px}
.csv-hero .role{margin-top:9px;font-size:16px;line-height:1.55}
.hero-kicker,.csv-hero .summary,.tip{display:none!important}

.hero-side{padding:18px 20px;justify-content:center;min-width:0}
.hero-side .label{margin-bottom:10px;font-size:13px}
.read-order{
 display:flex;
 flex-wrap:nowrap;
 align-items:center;
 gap:7px;
 min-width:0;
 overflow-x:auto;
 padding-bottom:2px;
 scrollbar-width:thin;
}
.read-chip{
 flex:1 0 112px;
 min-width:112px;
 justify-content:center;
 min-height:34px;
 padding:7px 10px;
 font-size:13px;
 text-align:center;
}
.read-arrow{flex:0 0 15px;text-align:center;font-size:14px}

/* 툴바 */
.table-toolbar{min-height:52px;padding:9px 12px 9px 15px}
.table-title strong{font-size:16px}
.table-title span,.help{display:none!important}
.toolbar-right{margin-left:auto}
.view-btn{padding:8px 12px;font-size:12.5px}

/* 표 */
table.sheet{font-size:14px;line-height:1.55}
.sheet th{padding:10px 11px}
.sheet th .kr{font-size:12.5px}
.sheet th .raw{font-size:10.5px}
.sheet td{padding:11px 12px}
.sheet .rowno{font-size:10px}
.key{padding:6px 8px;font-size:12.5px}
.key::after{
 content:"→";
 margin-left:3px;
 color:#6f8eaa;
 font-family:inherit;
 font-size:10px;
}
.key.selected::after{color:#b96528}

/* 데이터 의미 설명 */
.row-explain{padding:19px 18px 20px}
.explain-head{align-items:center;margin-bottom:14px}
.explain-head strong{font-size:17px}
.explain-head p{font-size:13.5px}
.explain-badge{display:none!important}
.skill-group-title strong{font-size:15.5px!important}
.skill-group-title code{font-size:11.5px!important}
.skill-group-count{font-size:11px}
.explain-row{
 grid-template-columns:40px minmax(210px,280px) minmax(0,1fr);
 padding:11px 10px;
}
.explain-num{font-size:11px}
.explain-id{font-size:11.5px}

  : `<div class="empty-link">연결된 다른 테이블이 없습니다.</div>`;

 document.querySelectorAll(".link-card").forEach(b=>b.onclick=()=>openFile(
  b.dataset.open,{col:b.dataset.col,value:b.dataset.value}
 ));
 d.classList.add("show");
}
function openFile(file,focus=null){
 currentFile=file;
 currentSystem=META[file].system;
 selected=null;

 let focusRow=null;

 if(focus){
  const rows=matchRows(file,focus.col,focus.value);
  if(rows.length){
   focusRow=rows[0].i;

   // 연결해서 연 실제 행을 상단 CSV와 하단 해석 영역이 함께 가리키도록 저장
   activeExplain={file:currentFile,row:focusRow};
   selected={file:currentFile,row:focusRow,col:focus.col,value:focus.value};
  }
 }

 renderAll();

 setTimeout(()=>{
  if(focusRow!==null){
   const tr=document.querySelector(`tr[data-row-index="${focusRow}"]`);
   if(tr){
    // 화면 이동은 기존과 동일하게 실제 CSV 행으로만 이동
    tr.scrollIntoView({behavior:"smooth",block:"center",inline:"nearest"});
    return;
   }
  }
  $("#tableCard").scrollIntoView({behavior:"smooth",block:"start"});
 },80);
}
document.querySelectorAll(".view-btn").forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;renderTable();renderExplain();renderDrawer()});$("#closeDrawer").onclick=()=>{selected=null;renderTable();renderExplain();renderDrawer()};
function renderAll(){renderTabs();renderFlow();renderHero();renderTable();renderExplain();renderDrawer()}renderAll();
</script>

<script>
(() => {
  const note = document.querySelector(".note");
  const toggle = document.getElementById("noteToggle");
  const button = document.getElementById("toggleButton");
  if (!note || !toggle || !button) return;

  const setOpen = (open) => {
    note.classList.toggle("collapsed", !open);
    toggle.setAttribute("aria-expanded", String(open));
    button.setAttribute("aria-label", open ? "데이터 테이블 접기" : "데이터 테이블 펼치기");
  };

  const toggleOpen = () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    setOpen(!open);
  };

  toggle.addEventListener("click", toggleOpen);
  toggle.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleOpen();
    }
  });

  // 데모에서는 내용을 바로 확인할 수 있도록 펼쳐진 상태로 시작
  setOpen(true);
})();
</script>


<script id="planning-height-reporter">
(function(){
  const KEY="data";
  let lastHeight=0, raf=0;
  function contentHeight(){
    const target=document.querySelector(".note-body")||document.querySelector(".note")||document.querySelector(".shell")||document.body;
    if(!target)return 0;
    const r=target.getBoundingClientRect();
    return Math.ceil(Math.max(target.scrollHeight||0,target.offsetHeight||0,r.height||0));
  }
  function report(force=false){
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      const h=contentHeight();
      if(!h)return;
      if(!force&&Math.abs(h-lastHeight)<1)return;
      lastHeight=h;
      parent.postMessage({type:"fill-grim-planning-height",key:KEY,height:h},"*");
    });
  }
  window.addEventListener("load",()=>{report(true);setTimeout(()=>report(true),80);setTimeout(()=>report(true),300);setTimeout(()=>report(true),900)});
  window.addEventListener("message",e=>{if(e.data&&e.data.type==="fill-grim-planning-measure")report(true)});
  document.addEventListener("click",()=>{report();setTimeout(()=>report(true),120);setTimeout(()=>report(true),400)});
  if(window.ResizeObserver){
    const target=document.querySelector(".note-body")||document.querySelector(".note")||document.querySelector(".shell");
    if(target)new ResizeObserver(()=>report()).observe(target);
  }
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>report(true));
})();
</script>
